name: Check Worker Version

# Cloudflare Worker는 대시보드에 코드를 붙여넣어 수동 배포하는 구조라, 실제로 어느
# 버전이 떠 있는지 로컬에서는 알 수 없다(Worker URL이 GitHub 시크릿으로만 있음).
# 인증 없는 /version 라우트(WORKER_BUILD 마커만 반환)를 시크릿 URL로 대신 호출해서
# 응답 본문을 로그에 찍어준다. 본문에는 비밀 정보가 없다. 수동 실행 전용.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch /version from the live Worker
        env:
          DISCORD_WORKER_URL: ${{ secrets.DISCORD_WORKER_URL }}
        run: |
          echo "--- GET /version ---"
          curl -sS --max-time 20 -w "\nHTTP %{http_code}\n" "${DISCORD_WORKER_URL%/}/version"
