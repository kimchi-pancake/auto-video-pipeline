name: Daily Video Pipeline

on:
  workflow_dispatch:
  # 이 워크플로우 자체의 GitHub 네이티브 schedule: cron은 일부러 안 씁니다.
  # 2026-07-20에 실제로 겪은 사고: 07:00 UTC로 걸어둔 schedule 트리거가
  # 3시간 15분 늦게(10:15 UTC)에야 발동했는데, 이 경로엔 "이미 실행 중이면
  # 스킵" 가드가 없어서 그 시각에 아직 돌고 있던 수동 실행과 겹쳐 대본이
  # 통째로 다시 생성되며 채널당 3개씩(총 6개) 중복 업로드됨. 매일 정시
  # 트리거는 tools/discord_worker/index.js의 Cloudflare Cron Trigger가
  # 전담합니다 — 그쪽은 dispatch 전에 findActiveDailyRun()으로 중복 실행
  # 여부를 확인하는 가드가 있습니다. 필요하면 workflow_dispatch로 수동
  # 트리거만 가능하게 남겨둡니다.

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Register Korean fonts (fontconfig) for subtitle burn-in
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo cp assets/fonts/*.ttf /usr/share/fonts/truetype/custom/
          sudo fc-cache -f

      - name: Install Python dependencies
        run: pip install -r requirements-headless.txt

      - name: Write secrets to config files
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YT_CHANNEL_UJJJAM_CREDENTIALS: ${{ secrets.YT_CHANNEL_UJJJAM_CREDENTIALS }}
          YT_CHANNEL_DOGAE_CREDENTIALS: ${{ secrets.YT_CHANNEL_DOGAE_CREDENTIALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p config/channels
          printf '%s' "$CONFIG_JSON" > config/config.json
          printf '%s' "$CLIENT_SECRETS_JSON" > config/client_secrets.json
          printf '%s' "$YT_CHANNEL_UJJJAM_CREDENTIALS" > "config/channels/웃짬_credentials.json"
          printf '%s' "$YT_CHANNEL_DOGAE_CREDENTIALS" > "config/channels/도개_credentials.json"
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .env
          # Windows PowerShell로 등록한 시크릿에 UTF-8 BOM이 섞여 들어올 수 있어 제거
          for f in config/config.json config/client_secrets.json "config/channels/웃짬_credentials.json" "config/channels/도개_credentials.json"; do
            sed -i '1s/^\xEF\xBB\xBF//' "$f"
          done

      - name: Run daily pipeline (script gen + video + upload)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_generate.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in config/daily_generate_state.json config/topic_queue.json config/video_registry.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "update daily generation state [skip ci]"
          git pull --rebase --autostash
          git push
