name: Daily Script Prepare

on:
  workflow_dispatch:
  # 이 워크플로우 자체의 GitHub 네이티브 schedule: cron은 일부러 안 씁니다.
  # 2026-07-20에 실제로 겪은 사고: 07:00 UTC로 걸어둔 schedule 트리거가
  # 3시간 15분 늦게(10:15 UTC)에야 발동했는데, 이 경로엔 "이미 실행 중이면
  # 스킵" 가드가 없어서 그 시각에 아직 돌고 있던 수동 실행과 겹쳐 대본이
  # 통째로 다시 생성되며 채널당 3개씩(총 6개) 중복 업로드됨. 매일 정시
  # 트리거는 tools/discord_worker/index.js의 Cloudflare Cron Trigger가
  # 전담합니다 — 그쪽은 dispatch 전에 findActiveDailyRun()으로 중복 실행
  # 여부를 확인하는 가드가 있습니다. 필요하면 workflow_dispatch로 수동
  # 트리거만 가능하게 남겨둡니다.
  #
  # 2026-08-04: "대본 생성 + 영상 조립"을 한 잡에서 같이 하던 걸 분리했습니다
  # (assemble_daily.yml 참고). 이 워크플로우는 이제 대본 생성만 하고, 저장
  # 시점에 Cloudflare Worker에 AI 씬 이미지 생성을 미리 요청해둡니다 — 그래야
  # Worker가 그림을 다 그릴 때까지 실제 조립(GH Actions 시간이 드는 무거운
  # 작업)을 기다리지 않아도 됩니다. Worker는 이미지 생성이 끝나면
  # assemble_daily.yml을 직접 트리거합니다.

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-headless.txt

      - name: Write secrets to config files
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          printf '%s' "$CONFIG_JSON" > config/config.json
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > .env
          # Windows PowerShell로 등록한 시크릿에 UTF-8 BOM이 섞여 들어올 수 있어 제거
          sed -i '1s/^\xEF\xBB\xBF//' config/config.json

      - name: Generate daily scripts + kick off AI image generation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WORKER_URL: ${{ secrets.DISCORD_WORKER_URL }}
          IMAGE_GEN_SECRET: ${{ secrets.IMAGE_GEN_SECRET }}
        run: python scripts/prepare_daily.py

      - name: Commit queued scripts + state
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- queue/pending_scripts
          for f in config/daily_generate_state.json config/topic_queue.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "queue daily scripts for assembly [skip ci]"
          git pull --rebase --autostash
          git push
