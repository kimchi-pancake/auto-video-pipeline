name: Weekly Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0" # 매주 월요일 07:00 KST(UTC+9) = 일요일 22:00 UTC
    # 읽기 전용 리포트 잡이라 daily.yml과 달리 상태 변경/중복 실행 위험이
    # 없어서(생성물이 없고, 매번 그 시점 최신 30일치를 다시 계산해 덮어씀)
    # native schedule을 그대로 씁니다 — collect_stats.yml과 동일한 이유.

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-headless.txt

      - name: Write secrets to config files
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          YT_CHANNEL_UJJJAM_CREDENTIALS: ${{ secrets.YT_CHANNEL_UJJJAM_CREDENTIALS }}
          YT_CHANNEL_DOGAE_CREDENTIALS: ${{ secrets.YT_CHANNEL_DOGAE_CREDENTIALS }}
        run: |
          mkdir -p config/channels
          printf '%s' "$CONFIG_JSON" > config/config.json
          printf '%s' "$YT_CHANNEL_UJJJAM_CREDENTIALS" > "config/channels/웃짬_credentials.json"
          printf '%s' "$YT_CHANNEL_DOGAE_CREDENTIALS" > "config/channels/도개_credentials.json"
          for f in config/config.json "config/channels/웃짬_credentials.json" "config/channels/도개_credentials.json"; do
            sed -i '1s/^\xEF\xBB\xBF//' "$f"
          done

      - name: Run weekly analysis
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/weekly_analysis.py

      - name: Commit category performance data
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f config/category_performance.json ] && git add config/category_performance.json
          git diff --staged --quiet || git commit -m "update weekly category performance [skip ci]"
          git pull --rebase --autostash
          git push
