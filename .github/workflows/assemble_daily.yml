name: Daily Video Assemble

on:
  workflow_dispatch:
  # 이 워크플로우도 daily.yml과 같은 이유로 GitHub 네이티브 schedule: cron을
  # 안 씁니다. 대신 두 가지 경로로 트리거됩니다(tools/discord_worker/index.js):
  #   1. Worker가 daily.yml이 큐에 넣어둔 대본들의 AI 씬 이미지 생성을 전부
  #      끝내면 곧바로 이 워크플로우를 트리거함(빠른 경로 — 이미지가 이미
  #      다 있어서 core/pipeline.py의 대기 시간이 거의 없음).
  #   2. 혹시 1번 트리거가 (Worker가 죽어있거나 네트워크 문제로) 안 왔을 때를
  #      대비한 안전망으로, Worker의 별도 cron이 daily.yml보다 몇 시간 늦게
  #      한 번 더 트리거함 — 그때도 큐가 비어 있으면 scripts/daily_generate.py가
  #      조용히 아무 일도 안 하고 끝남.
  # concurrency 그룹으로 두 트리거가 겹쳐도 동시에 두 잡이 돌지 않게 막습니다.

concurrency:
  group: assemble-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Register Korean fonts (fontconfig) for subtitle burn-in
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo cp assets/fonts/*.ttf /usr/share/fonts/truetype/custom/
          sudo fc-cache -f

      - name: Install Python dependencies
        run: pip install -r requirements-headless.txt

      - name: Write secrets to config files
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YT_CHANNEL_UJJJAM_CREDENTIALS: ${{ secrets.YT_CHANNEL_UJJJAM_CREDENTIALS }}
          YT_CHANNEL_DOGAE_CREDENTIALS: ${{ secrets.YT_CHANNEL_DOGAE_CREDENTIALS }}
        run: |
          mkdir -p config/channels
          printf '%s' "$CONFIG_JSON" > config/config.json
          printf '%s' "$CLIENT_SECRETS_JSON" > config/client_secrets.json
          printf '%s' "$YT_CHANNEL_UJJJAM_CREDENTIALS" > "config/channels/웃짬_credentials.json"
          printf '%s' "$YT_CHANNEL_DOGAE_CREDENTIALS" > "config/channels/도개_credentials.json"
          # Windows PowerShell로 등록한 시크릿에 UTF-8 BOM이 섞여 들어올 수 있어 제거
          for f in config/config.json config/client_secrets.json "config/channels/웃짬_credentials.json" "config/channels/도개_credentials.json"; do
            sed -i '1s/^\xEF\xBB\xBF//' "$f"
          done

      - name: Assemble queued videos + upload
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WORKER_URL: ${{ secrets.DISCORD_WORKER_URL }}
          IMAGE_GEN_SECRET: ${{ secrets.IMAGE_GEN_SECRET }}
        run: python scripts/daily_generate.py

      # 렌더링은 성공했는데 유튜브 업로드만 실패하는 경우(자격증명 만료 등)가
      # 있었는데, 이 러너는 job이 끝나면 파일시스템이 통째로 사라져서 archive/
      # 안의 완성된 영상이 그대로 유실됐음(2026-07-24 사고). 업로드 성공 여부와
      # 무관하게 archive/ 를 항상 artifact로 잠깐 보관해서, 실패했을 때 처음부터
      # 다시 만들지 않고 tools/upload_from_archive.py 로 재업로드만 하면 되게 함.
      - name: Upload produced videos as a recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produced-videos-${{ github.run_id }}
          path: archive/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          # daily_generate.py가 queue/pending_scripts/에서 input_dir로 옮겨간
          # 대본(더 이상 큐에 없음)을 삭제로 반영합니다.
          git add -A -- queue/pending_scripts
          [ -f config/video_registry.json ] && git add config/video_registry.json
          # Worker가 백그라운드로 커밋해둔 AI 이미지는 합성이 끝나면 더 필요
          # 없습니다. 2시간 넘은(=이미 끝났거나 죽은 런) 폴더만 안전하게
          # 정리합니다(동시에 도는 다른 채널의 런이 아직 쓰고 있을 수 있어서).
          if [ -d assets/pending_images ]; then
            find assets/pending_images -mindepth 1 -maxdepth 1 -type d -mmin +120 -print0 \
              | xargs -0 -r git rm -rq --ignore-unmatch -r
          fi
          git diff --staged --quiet || git commit -m "update video registry [skip ci]"
          git pull --rebase --autostash
          git push
