name: Collect Video Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST(UTC+9) = 전날 15:00 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-headless.txt

      - name: Write secrets to config files
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          YT_CHANNEL_UJJJAM_CREDENTIALS: ${{ secrets.YT_CHANNEL_UJJJAM_CREDENTIALS }}
          YT_CHANNEL_DOGAE_CREDENTIALS: ${{ secrets.YT_CHANNEL_DOGAE_CREDENTIALS }}
        run: |
          mkdir -p config/channels
          printf '%s' "$CONFIG_JSON" > config/config.json
          printf '%s' "$YT_CHANNEL_UJJJAM_CREDENTIALS" > "config/channels/웃짬_credentials.json"
          printf '%s' "$YT_CHANNEL_DOGAE_CREDENTIALS" > "config/channels/도개_credentials.json"
          for f in config/config.json "config/channels/웃짬_credentials.json" "config/channels/도개_credentials.json"; do
            sed -i '1s/^\xEF\xBB\xBF//' "$f"
          done

      - name: Collect stats
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/collect_stats.py

      - name: Commit updated registry
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f config/video_registry.json ] && git add config/video_registry.json
          git diff --staged --quiet || git commit -m "update video stats [skip ci]"
          git pull --rebase --autostash
          git push
