name: Generate Topics

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널명"
        required: true
        type: string
      count:
        description: "생성할 개수"
        required: true
        type: string
      category:
        description: "카테고리 (비우면 자동)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install anthropic python-dotenv colorlog

      - name: Write secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .env

      - name: Generate topics
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/generate_topics.py --channel "${{ inputs.channel }}" --count "${{ inputs.count }}" --category "${{ inputs.category }}"

      - name: Commit updated queue
        if: always()
        run: |
          git config user.name "auto-video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f config/topic_queue.json ] && git add config/topic_queue.json
          git diff --staged --quiet || git commit -m "queue generated topics for ${{ inputs.channel }} [skip ci]"
          git pull --rebase --autostash
          git push
