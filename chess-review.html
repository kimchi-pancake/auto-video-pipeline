<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 리뷰 — tequila-soda vs cijeonchesspro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1816; --bg2:#262421; --bg3:#302e2b; --bg4:#3d3a37;
  --line:#4a4643; --tx:#e9e6e3; --tx2:#a8a29c; --tx3:#7c7772;
  --lite:#ebecd0; --dark:#739552; --hl:#f6f669;
  --brilliant:#1baca6; --great:#5c8bb0; --best:#95bb4b; --excellent:#96bc4b;
  --good:#96af8b; --book:#a88865; --forced:#7c7772; --inaccuracy:#f7c631; --mistake:#ffa459;
  --miss:#ff7769; --blunder:#fa412d;
  --sq:min(72px, calc((100vw - 120px)/8));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);
  font-family:"Noto Sans KR",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding:24px 16px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* ── header ───────────────────────────── */
.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{font-size:26px;font-weight:900;letter-spacing:-.4px}
.hdr .sub{color:var(--tx3);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
  font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px}

/* ── layout ───────────────────────────── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media(max-width:1000px){.main{grid-template-columns:1fr}}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px}

/* ── board ────────────────────────────── */
.boardrow{display:flex;gap:10px}
.evalbar{width:22px;border-radius:5px;overflow:hidden;background:#3a3a38;
  position:relative;flex:0 0 22px;box-shadow:inset 0 0 0 1px var(--line)}
.evalbar .wfill{position:absolute;left:0;right:0;bottom:0;background:#f2f2f2;
  transition:height .35s cubic-bezier(.4,0,.2,1)}
.evalbar .txt{position:absolute;left:0;right:0;font-size:9px;font-weight:800;
  text-align:center;letter-spacing:-.3px;z-index:2}
.evalbar .txt.bot{bottom:3px;color:#3a3a38}
.evalbar .txt.top{top:3px;color:#e9e6e3}

.boardwrap{position:relative;flex:1;min-width:0}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.45);user-select:none}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--lite)} .sq.d{background:var(--dark)}
.sq.hl::after{content:"";position:absolute;inset:0;background:var(--hl);opacity:.45}
.sq.chk::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle,rgba(255,60,40,.95) 12%,rgba(255,60,40,.55) 42%,transparent 72%)}
.sq .co{position:absolute;font-size:10px;font-weight:700;opacity:.62}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
.sq.l .co{color:var(--dark)} .sq.d .co{color:var(--lite)}
.pc{position:absolute;width:12.5%;height:12.5%;background-size:contain;
  background-repeat:no-repeat;background-position:center;z-index:3;pointer-events:none;
  transition:left .18s ease, top .18s ease}
.arrows{position:absolute;inset:0;z-index:4;pointer-events:none}
.badge{position:absolute;z-index:6;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:13px;color:#fff;transform:translate(35%,-35%);
  box-shadow:0 2px 8px rgba(0,0,0,.5);border:2px solid rgba(0,0,0,.25);
  font-family:Inter,sans-serif;line-height:1}

/* ── controls ─────────────────────────── */
.ctrl{display:flex;gap:6px;margin-top:10px;align-items:stretch}
.btn{flex:1;background:var(--bg3);border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:10px;font-size:15px;cursor:pointer;font-weight:700;
  transition:.12s;font-family:inherit}
.btn:hover{background:var(--bg4);border-color:#5d5854}
.btn:active{transform:translateY(1px)}
.btn.sm{flex:0 0 auto;padding:10px 13px;font-size:13px}
.btn.on{background:var(--best);border-color:var(--best);color:#1a1816}

/* ── commentary ───────────────────────── */
.note{margin-top:12px;padding:14px 16px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);border-left:4px solid var(--tx3)}
.note .top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.note .mv{font-weight:800;font-size:17px;font-family:Inter,sans-serif}
.note .lbl{font-weight:800;font-size:14px}
.note .ev{margin-left:auto;font-size:12px;color:var(--tx3);font-family:Inter,sans-serif;font-weight:600}
.note p{font-size:13.5px;line-height:1.72;color:var(--tx2)}
.note .better{margin-top:9px;font-size:12.5px;color:var(--tx2);background:var(--bg3);
  padding:8px 11px;border-radius:7px;line-height:1.6}
.note .better b{color:var(--best);font-family:Inter,sans-serif}
.note .pv{font-family:Inter,ui-monospace,monospace;color:var(--tx3);font-size:12px}

/* ── right panel ──────────────────────── */
.players{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pl{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px}
.pl .av{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:16px;flex:0 0 36px;font-family:Inter,sans-serif}
.pl .av.w{background:#f2f2f2;color:#262421} .pl .av.b{background:#3d3a37;color:#e9e6e3;border:1px solid var(--line)}
.pl .nm{font-weight:700;font-size:14px;line-height:1.3}
.pl .el{font-size:11.5px;color:var(--tx3);font-family:Inter,sans-serif}
.pl .acc{margin-left:auto;text-align:right}
.pl .acc .n{font-size:21px;font-weight:900;font-family:Inter,sans-serif;line-height:1}
.pl .acc .c{font-size:9.5px;color:var(--tx3);letter-spacing:.4px;margin-top:2px}
.pl .won{font-size:10px;font-weight:800;background:var(--best);color:#1a1816;
  padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}

.tabs{display:flex;gap:4px;padding:5px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;margin-bottom:10px}
.tabs button{flex:1;background:none;border:0;color:var(--tx3);font-weight:700;font-size:12.5px;
  padding:8px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.12s}
.tabs button.on{background:var(--bg4);color:var(--tx)}

.moves{max-height:520px;overflow-y:auto;padding:5px}
.moves::-webkit-scrollbar{width:9px}
.moves::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:9px}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center;border-radius:6px}
.mrow:nth-child(odd){background:rgba(255,255,255,.022)}
.mrow .n{color:var(--tx3);font-size:12px;text-align:center;font-family:Inter,sans-serif;font-weight:600}
.mv{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;
  border-radius:6px;font-family:Inter,sans-serif;font-weight:700;font-size:13.5px;transition:.1s}
.mv:hover{background:var(--bg4)}
.mv.act{background:var(--bg4);box-shadow:inset 3px 0 0 var(--best)}
.mv .i{width:17px;height:17px;border-radius:50%;flex:0 0 17px;display:flex;
  align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;line-height:1}

.sum{padding:12px}
.sumhd{display:grid;grid-template-columns:1fr 46px 46px;font-size:10.5px;color:var(--tx3);
  font-weight:700;padding:0 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sumhd span:not(:first-child){text-align:center}
.srow{display:grid;grid-template-columns:1fr 46px 46px;align-items:center;
  padding:7px 8px;border-radius:6px;font-size:12.5px}
.srow:hover{background:var(--bg3)}
.srow .lb{display:flex;align-items:center;gap:8px;font-weight:600}
.srow .i{width:19px;height:19px;border-radius:50%;flex:0 0 19px;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;
  font-family:Inter,sans-serif;line-height:1}
.srow .v{text-align:center;font-family:Inter,sans-serif;font-weight:800;font-size:14px}
.srow .v.z{color:var(--tx3);opacity:.45;font-weight:600}

/* ── chart ────────────────────────────── */
.chart{margin-top:22px;padding:14px 16px 10px}
.chart h3{font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.chart h3 small{color:var(--tx3);font-weight:500;font-size:11px}
.chart svg{display:block;width:100%;height:132px;cursor:crosshair;border-radius:5px}

/* ── key moments ──────────────────────── */
.km{margin-top:22px;padding:16px}
.km h3{font-size:13px;font-weight:800;margin-bottom:12px}
.kmlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.kmi{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--bg3);
  border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:.12s}
.kmi:hover{background:var(--bg4);transform:translateY(-1px)}
.kmi .i{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;
  font-family:Inter,sans-serif;line-height:1}
.kmi .t{font-size:12.5px;font-weight:700;font-family:Inter,sans-serif}
.kmi .d{font-size:11px;color:var(--tx3);margin-top:3px;line-height:1.5;
  font-family:"Noto Sans KR",sans-serif;font-weight:400}

.foot{margin-top:26px;text-align:center;color:var(--tx3);font-size:11px;line-height:1.8}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font-size:10px;font-family:Inter,sans-serif}
</style>
</head>

let idx = -1, flipped = false, showArrow = true, timer = null;

/* ── FEN → board ── */
function parseFen(fen){
  const rowsF = fen.split(" ")[0].split("/"), out = [];
  for (let r = 0; r < 8; r++){
    const line = [];
    for (const ch of rowsF[r]){
      if (/\d/.test(ch)) for (let k = 0; k < +ch; k++) line.push(null);
      else line.push((ch === ch.toUpperCase() ? "w" : "b") + ch.toLowerCase());
    }
    out.push(line);
  }
  return out;                           // out[0] = rank 8
}
const sqName = (f,r) => "abcdefgh"[f] + (8 - r);
function pos(f, r){                     // → {x,y} in % (top-left of square)
  return flipped ? {x:(7-f)*12.5, y:(7-r)*12.5} : {x:f*12.5, y:r*12.5};
}
function fileRank(sq){ return [ "abcdefgh".indexOf(sq[0]), 8 - (+sq[1]) ]; }

function cur(){ return idx >= 0 ? DATA.moves[idx] : null; }
function fen(){ return idx >= 0 ? DATA.moves[idx].fen_after : START; }

/* ── board render ── */
function drawBoard(){
  const b = document.getElementById("board");
  const m = cur(), bd = parseFen(fen());
  const hl = m ? [m.from_sq, m.to_sq] : [];
  let chkSq = null;
  if (m && m.check){
    const side = m.color === "w" ? "bk" : "wk";
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++)
      if (bd[r][f] === side) chkSq = sqName(f, r);
  }
  let h = "";
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    const n = sqName(f, r), p = pos(f, r);
    const cls = ["sq", (f + r) % 2 ? "d" : "l"];
    if (hl.includes(n)) cls.push("hl");
    if (n === chkSq)   cls.push("chk");
    let co = "";
    const lastRow = flipped ? r === 0 : r === 7, firstCol = flipped ? f === 7 : f === 0;
    if (lastRow)  co += `<span class="co f">${"abcdefgh"[f]}</span>`;
    if (firstCol) co += `<span class="co r">${8 - r}</span>`;
    h += `<div class="${cls.join(" ")}" style="left:${p.x}%;top:${p.y}%">${co}</div>`;
  }
  // pieces (keyed by square so CSS transition animates)
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    const pc = bd[r][f]; if (!pc) continue;
    const p = pos(f, r);
    h += `<div class="pc" style="left:${p.x}%;top:${p.y}%;background-image:url(${PIECES[pc]})"></div>`;
  }
  // best-move arrow
  if (m && showArrow && !m.is_best && ["inaccuracy","mistake","miss","blunder"].includes(m.cls)){
    const [f1,r1] = fileRank(m.best_uci.slice(0,2)), [f2,r2] = fileRank(m.best_uci.slice(2,4));
    const a = pos(f1,r1), c = pos(f2,r2);
    const x1 = a.x + 6.25, y1 = a.y + 6.25, x2 = c.x + 6.25, y2 = c.y + 6.25;
    const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy);
    const ex = x2 - dx/L*4.6, ey = y2 - dy/L*4.6;
    h += `<svg class="arrows" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
        <path d="M0,0 L4,2 L0,4 z" fill="#95bb4b"/></marker></defs>
      <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="#95bb4b" stroke-width="2.1"
        stroke-linecap="round" opacity=".85" marker-end="url(#ah)"/></svg>`;
  }
  // classification badge
  if (m){
    const [f,r] = fileRank(m.to_sq), p = pos(f,r), k = CLS[m.cls];
    h += `<div class="badge" style="left:${p.x+12.5}%;top:${p.y}%;background:${k.c}"
            title="${k.ko}">${k.sym}</div>`;
  }
  b.innerHTML = h;
}

/* ── eval bar ── */
function cpText(cp, mate){
  if (mate !== null && mate !== undefined) return "M" + Math.abs(mate);
  const v = cp / 100;
  return (v > 0 ? "+" : "") + v.toFixed(1);
}
function whiteCp(){
  const m = cur(); if (!m) return 0;
  return m.color === "w" ? m.played_cp : -m.played_cp;
}
function drawEval(){
  const cp = whiteCp();
  const pct = 50 + 50 * (2/(1+Math.exp(-0.00368208*Math.max(-1200,Math.min(1200,cp)))) - 1);
  document.getElementById("wfill").style.height = pct.toFixed(1) + "%";
  const m = cur();
  let mate = null;
  if (m && m.mate_after !== null && m.mate_after !== undefined)
    mate = m.color === "w" ? m.mate_after : -m.mate_after;
  const t = mate !== null ? "M" + Math.abs(mate) : (Math.abs(cp)/100).toFixed(1);
  const whiteAhead = mate !== null ? mate > 0 : cp >= 0;
  document.getElementById("evbot").textContent =  whiteAhead ? t : "";
  document.getElementById("evtop").textContent = !whiteAhead ? t : "";
}

function drawNote(){
  const el = document.getElementById("note"), m = cur();
  if (!m){
    el.style.borderLeftColor = "var(--tx3)";
    el.innerHTML = `<div class="top"><span class="mv">시작 국면</span></div>
      <p>${DATA.meta.opening}. <b>${DATA.meta.white}</b>(백, ${DATA.meta.welo}) vs
      <b>${DATA.meta.black}</b>(흑, ${DATA.meta.belo}).
      화살표 키나 아래 기보를 눌러 수를 따라가 보세요.</p>`;
    return;
  }
  const k = CLS[m.cls];
  el.style.borderLeftColor = k.c;
  const num = m.no + (m.color === "w" ? "." : "...");
  let better = "";
  if (!m.is_best && ["inaccuracy","mistake","miss","blunder","good"].includes(m.cls)){
    better = `<div class="better">더 좋았던 수 <b>${m.best_san}</b>
      <span class="pv">— ${m.best_pv.join(" ")}</span></div>`;
  }
  el.innerHTML = `<div class="top">
      <span class="mv">${num} ${m.san}</span>
      <span class="lbl" style="color:${k.c}">${k.ko}</span>
      <span class="ev">${cpText(m.played_cp * (m.color === "w" ? 1 : -1), 
        m.mate_after == null ? null : (m.color === "w" ? m.mate_after : -m.mate_after))}</span>
    </div>
    <p>${m.note || AUTO[m.cls](m)}</p>${better}`;
}

/* ── move list ── */
function drawMoves(){
  const el = document.getElementById("moves");
  let h = "";
  for (let i = 0; i < DATA.moves.length; i += 2){
    const w = DATA.moves[i], b = DATA.moves[i+1];
    h += `<div class="mrow"><span class="n">${w.no}</span>${cell(w,i)}${b ? cell(b,i+1) : "<span></span>"}</div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll(".mv").forEach(n => n.onclick = () => go(+n.dataset.i));
}
function cell(m, i){
  const k = CLS[m.cls];
  return `<span class="mv${i===idx?" act":""}" data-i="${i}">
    <span class="i" style="background:${k.c}" title="${k.ko}">${k.sym}</span>${m.san}</span>`;
}
function syncMoves(){
  document.querySelectorAll(".mv").forEach(n => {
    const on = +n.dataset.i === idx;
    n.classList.toggle("act", on);
    if (on) n.scrollIntoView({block:"nearest"});
  });
}

/* ── players + summary ── */
function drawPlayers(){
  const M = DATA.meta;
  const card = (side) => {
    const nm  = side === "w" ? M.white : M.black;
    const elo = side === "w" ? M.welo  : M.belo;
    const won = (M.result === "1-0" && side === "w") || (M.result === "0-1" && side === "b");
    const a   = DATA.acc[side];
    const col = a >= 80 ? "var(--best)" : a >= 60 ? "var(--inaccuracy)" : "var(--miss)";
    return `<div class="pl">
      <div class="av ${side}">${nm[0].toUpperCase()}</div>
      <div><div class="nm">${nm}${won?'<span class="won">승</span>':""}</div>
           <div class="el">${side==="w"?"백":"흑"} · ${elo}</div></div>
      <div class="acc"><div class="n" style="color:${col}">${a}</div>
           <div class="c">정확도</div></div></div>`;
  };
  document.getElementById("players").innerHTML = card("w") + card("b");

  let h = `<div class="sumhd"><span>수 분류</span><span>백</span><span>흑</span></div>`;
  for (const c of ORDER){
    const k = CLS[c], w = DATA.counts.w[c], b = DATA.counts.b[c];
    if (!w && !b) continue;
    h += `<div class="srow"><span class="lb">
        <span class="i" style="background:${k.c}">${k.sym}</span>${k.ko}</span>
      <span class="v${w?"":" z"}">${w}</span><span class="v${b?"":" z"}">${b}</span></div>`;
  }
  document.getElementById("sum").innerHTML = h;
}

/* ── eval chart ── */
function drawChart(){
  const W = 700, H = 132, n = DATA.moves.length;
  const yOf = cp => {
    const c = Math.max(-1000, Math.min(1000, cp));
    const p = 1/(1+Math.exp(-0.0035*c));           // 0..1, 1 = white winning
    return p * H;                                  // white winning -> boundary at bottom
  };
  const xOf = i => (i + 1) / n * W;
  let d = `M 0 ${yOf(0)}`;
  DATA.moves.forEach((m,i) => {
    const cp = m.color === "w" ? m.played_cp : -m.played_cp;
    d += ` L ${xOf(i).toFixed(1)} ${yOf(cp).toFixed(1)}`;
  });
  const area = d + ` L ${W} 0 L 0 0 Z`;
  let marks = "";
  DATA.moves.forEach((m,i) => {
    if (!["blunder","mistake","miss","brilliant","great"].includes(m.cls)) return;
    const cp = m.color === "w" ? m.played_cp : -m.played_cp;
    marks += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(cp).toFixed(1)}" r="4"
      fill="${CLS[m.cls].c}" stroke="#1a1816" stroke-width="1.6"/>`;
  });
  const cx = idx >= 0 ? xOf(idx) : 0;
  document.getElementById("chart").innerHTML = `
    <rect width="${W}" height="${H}" fill="#3d3a37"/>
    <path d="${area}" fill="#e9e6e3"/>
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#8a8580" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="#7c7772" stroke-width="1.2" opacity=".5"/>
    ${marks}
    <line x1="${cx.toFixed(1)}" y1="0" x2="${cx.toFixed(1)}" y2="${H}" stroke="#fa412d" stroke-width="1.6"/>`;
}

/* ── key moments ── */
function drawKM(){
  const picks = DATA.moves
    .map((m,i) => ({m,i}))
    .filter(o => ["blunder","miss","brilliant","great"].includes(o.m.cls)
              || (o.m.cls === "mistake" && o.m.drop >= 14))
    .sort((a,b) => b.m.drop - a.m.drop)
    .slice(0, 8)
    .sort((a,b) => a.i - b.i);
  document.getElementById("km").innerHTML = picks.map(o => {
    const k = CLS[o.m.cls], who = o.m.color === "w" ? DATA.meta.white : DATA.meta.black;
    return `<div class="kmi" data-i="${o.i}">
      <span class="i" style="background:${k.c}">${k.sym}</span>
      <div><div class="t">${o.m.no}${o.m.color==="w"?".":"..."} ${o.m.san}
        <span style="color:${k.c};font-size:11px">· ${k.ko}</span></div>
      <div class="d">${who} — ${(o.m.note || "").replace(/<[^>]+>/g,"").slice(0,80) ||
        "승률 " + o.m.drop.toFixed(0) + "%p 변동"}</div></div></div>`;
  }).join("");
  document.querySelectorAll(".kmi").forEach(n => n.onclick = () => go(+n.dataset.i));
}

/* ── nav ── */
function render(){ drawBoard(); drawEval(); drawNote(); syncMoves(); drawChart(); }
function go(i){ idx = Math.max(-1, Math.min(DATA.moves.length - 1, i)); render(); }
function stop(){ if (timer){ clearInterval(timer); timer = null;
  document.getElementById("play").classList.remove("on");
  document.getElementById("play").textContent = "▶"; } }

document.getElementById("first").onclick = () => { stop(); go(-1); };
document.getElementById("prev").onclick  = () => { stop(); go(idx - 1); };
document.getElementById("next").onclick  = () => { stop(); go(idx + 1); };
document.getElementById("last").onclick  = () => { stop(); go(DATA.moves.length - 1); };
document.getElementById("play").onclick  = function(){
  if (timer){ stop(); return; }
  if (idx >= DATA.moves.length - 1) idx = -1;
  this.classList.add("on"); this.textContent = "⏸";
  timer = setInterval(() => { if (idx >= DATA.moves.length - 1) stop(); else go(idx + 1); }, 1100);
};
document.getElementById("flip").onclick  = () => { flipped = !flipped; drawBoard(); };
document.getElementById("arrow").onclick = function(){
  showArrow = !showArrow; this.classList.toggle("on", showArrow); drawBoard(); };
document.getElementById("arrow").classList.add("on");
document.getElementById("chart").onclick = e => {
  stop();
  const r = e.currentTarget.getBoundingClientRect();
  go(Math.round((e.clientX - r.left) / r.width * DATA.moves.length) - 1);
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  const mv = b.dataset.t === "moves";
  document.getElementById("moves").style.display = mv ? "" : "none";
  document.getElementById("sum").style.display   = mv ? "none" : "";
});
document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowRight"){ stop(); go(idx + 1); }
  else if (k === "ArrowLeft"){ stop(); go(idx - 1); }
  else if (k === "Home"){ stop(); go(-1); }
  else if (k === "End"){ stop(); go(DATA.moves.length - 1); }
  else if (k === "f" || k === "F"){ flipped = !flipped; drawBoard(); }
  else if (k === " "){ e.preventDefault(); document.getElementById("play").click(); }
  else return;
  e.preventDefault();
});

const h0 = parseInt(location.hash.slice(1), 10);
if (!isNaN(h0)) idx = Math.max(-1, Math.min(DATA.moves.length - 1, h0 - 1));
drawPlayers(); drawMoves(); drawKM(); render();
</script>
</body>
</html>
